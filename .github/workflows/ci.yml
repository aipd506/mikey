name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc-checks:
    name: PC (Rust) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pc/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Rustfmt
        run: cargo fmt --check --manifest-path pc/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path pc/Cargo.toml -- -D warnings

      - name: Tests
        run: cargo test --manifest-path pc/Cargo.toml

  android-checks:
    name: Android — Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit Tests & Lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug
