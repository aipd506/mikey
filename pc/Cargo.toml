[package]
name = "mikey"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
cpal = "0.15"
rubato = "0.15"
opus-decoder = "0.1"
zune-jpeg = "0.5"
minifb = "0.28"
nnnoiseless = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
muda = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
